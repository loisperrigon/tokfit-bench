name: bench

# Une tâche à la fois : on lance, on vérifie, puis la suivante.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche de Terminal-Bench 4.0 (voir tasks.txt)"
        required: true
      configs:
        description: "Configurations (JSON)"
        default: '["vanilla", "tokfit"]'
      effort:
        description: "Réflexion des deux côtés (medium ou high)"
        default: "medium"
      campaign:
        description: "Campagne (banc.py) : notée dans chaque résultat, un run sans campagne ne compte nulle part"
        default: ""

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.configs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harbor
        run: pip install "harbor==0.26.0"
      - name: Tâche
        run: |
          grep -qx "${{ inputs.task }}" tasks.txt || { echo "tâche hors du tirage"; exit 1; }
          # Le stockage des tâches répond parfois 504 : nouvelles tentatives espacées.
          for essai in 1 2 3 4 5 6; do
            harbor dataset download terminal-bench/terminal-bench -o tasks && test -d "tasks/terminal-bench/${{ inputs.task }}" && break
            echo "téléchargement raté (essai $essai), nouvelle tentative"; sleep $((essai * 30))
          done
          test -d "tasks/terminal-bench/${{ inputs.task }}"
      - name: Plugin tokfit publié
        if: matrix.config == 'tokfit'
        env:
          TOKFIT_BENCH_KEY: ${{ secrets.TOKFIT_BENCH_KEY }}
        run: |
          git clone --depth 1 https://github.com/loisperrigon/tokfit-connector.git /tmp/tokfit-connector
          mkdir -p ~/.config/tokfit-bench
          python -c 'import json,os; print(json.dumps({"key": os.environ["TOKFIT_BENCH_KEY"]}))' > ~/.config/tokfit-bench/config.json
          chmod 600 ~/.config/tokfit-bench/config.json
          echo "TOKFIT_PUBLIC_PLUGIN=/tmp/tokfit-connector/claude-code" >> "$GITHUB_ENV"
          grep '"version"' /tmp/tokfit-connector/claude-code/.claude-plugin/plugin.json
      - name: Docker prêt
        run: |
          # Un runner a déjà démarré sans démon Docker (« Docker daemon is not running ») : on le lance et on attend.
          for essai in 1 2 3 4 5 6; do
            docker info >/dev/null 2>&1 && break
            echo "Docker pas prêt (essai $essai)"; sudo systemctl start docker || true; sleep $((essai * 5))
          done
          docker info --format '{{.ServerVersion}}'
      - name: Banc
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BENCH_EFFORT: ${{ inputs.effort }}
          BENCH_CAMPAIGN: ${{ inputs.campaign }}
        run: python run_task.py "${{ inputs.task }}" "${{ matrix.config }}"
      - name: Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task }}-${{ matrix.config }}
          path: out/${{ matrix.config }}
          retention-days: 90

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Tableau
        run: python report.py results >> "$GITHUB_STEP_SUMMARY"
